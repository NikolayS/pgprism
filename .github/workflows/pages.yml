name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Stage Pages site
        run: |
          mkdir -p _site/dist _site/demo _site/docs
          cp -R dist/. _site/dist/
          cp dist/pgprism.iife.js _site/pgprism.iife.js
          cp -R docs/. _site/docs/
          cp demo/index.html _site/demo/index.html
          cp demo/index.html _site/index.html
          touch _site/.nojekyll
          echo "pgprism.dev" > _site/CNAME
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
